# Render Blueprint: the backend service as code, so the deploy is reproducible and reviewable.
services:
  - type: web
    name: eneba-market-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt # same region as the Neon database
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr # show Laravel logs in Render's log viewer
      - key: DB_CONNECTION
        value: pgsql
      # Secrets: sync:false means Render asks for them in the dashboard; they never live in git.
      - key: APP_KEY
        sync: false
      - key: DB_URL
        sync: false
